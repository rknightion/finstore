name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The acceptance-evidence check reads the pull request body, so it runs in pr-metadata.yml;
    # a body edit does not re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      # The tests start a private PostgreSQL 18 cluster from the server binaries; they never use a
      # running service or a container.
      - name: Install PostgreSQL 18 binaries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: just check </dev/null

  docker-build:
    name: docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: finstore:ci
          # Read the cache published by the main linux/amd64 builder on matching PR runners.
          cache-from: ${{ github.event_name == 'pull_request' && runner.os == 'Linux' && runner.arch == 'X64' && 'type=registry,ref=ghcr.io/rknightion/finstore:buildcache-linux-amd64' || '' }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@47976d7e85fddb1c3c329cc870612b59ac433849 # v1.32.8

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [build-test, docker-build, privacy-sweep]
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
        run: |
          if [[ "$PRIVACY_SWEEP" != "success" ]]; then
            echo "privacy-sweep: ${PRIVACY_SWEEP}; must pass on a pull request"
            exit 1
          fi
