# An example deployment: the database, the service, a Tailscale sidecar that is the only way in, and
# a one-off container for the owner commands. Copy it, set your own paths, and keep the env files at
# mode 600. docs/operations.md explains the sidecar and the alternative of a sign-in proxy.
name: finstore

services:
  finstore-db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    container_name: finstore-db
    restart: unless-stopped
    env_file: ./owner.env # POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: finstore
    volumes:
      # A bind mount, so the data directory is easy to leave out of a file-level backup: a copy of
      # a running data directory is not a backup. The dump script is.
      - ./data/pgdata:/var/lib/postgresql
    # No ports: the database is reached only by the service and through `docker exec`.
    networks: [default]
    healthcheck:
      # Over TCP on purpose: during the image's first start a temporary server answers on the
      # socket before the real one listens on the network.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d finstore"]
      interval: 10s
      timeout: 5s
      retries: 10

  finstore:
    image: ghcr.io/rknightion/finstore:main
    container_name: finstore
    restart: unless-stopped
    env_file: ./finstore.env
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Written by the dump script; the service only reports its time as a metric.
      - ./data/status:/var/lib/finstore/status:ro
    # No ports and no shared network: only the sidecar below reaches port 8080. Anything that can
    # reach it directly can claim to be anyone through FINSTORE_AUTH_HEADER.
    networks: [default]
    depends_on:
      finstore-db:
        condition: service_healthy

  # The service's own tailnet node. `tailscale serve` terminates HTTPS with a certificate for the
  # node's MagicDNS name (TS_HOSTNAME plus your tailnet's DNS suffix), proxies to finstore:8080, and
  # adds Tailscale-User-Login for a signed-in user's device (stripping any copy the client sent).
  # Tagged devices get no such header and so get 404 from the pages. They can still use /mcp: the
  # handler in tailscale-serve.json lists an app capability in AcceptAppCaps, and the proxy passes
  # the caller's grant of it in Tailscale-App-Capabilities (also stripping any copy the client
  # sent), which /mcp requires (FINSTORE_MCP_APP_CAP). Restrict who reaches the tag in your
  # tailnet policy.
  finstore-ts:
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    container_name: finstore-ts
    restart: unless-stopped
    env_file: ./ts.env # TS_AUTHKEY: a pre-authorised key for the tag; used once, then the state holds the identity
    environment:
      TS_HOSTNAME: finstore
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: "--advertise-tags=tag:finstore"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
      TS_SERVE_CONFIG: /config/tailscale-serve.json
    volumes:
      - ./data/ts-state:/var/lib/tailscale
      # Mount the directory, not the file: a bind-mounted file breaks config-change detection.
      - ./ts:/config:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default]
    depends_on: [finstore]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # docker compose run --rm finstore-admin bootstrap|migrate|renormalise
  finstore-admin:
    image: ghcr.io/rknightion/finstore:main
    profiles: ["admin"]
    env_file: [./finstore.env, ./owner.env]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default]
    depends_on:
      finstore-db:
        condition: service_healthy
